name: Bug report
description: Report a reproducible problem in agentic-sdlc-workflow.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form for a reproducible problem. Do not include private data or security details - see SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Commit
      description: The commit SHA you ran, from git rev-parse --short HEAD.
      placeholder: e.g. a1b2c3d
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
